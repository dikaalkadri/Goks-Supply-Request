name: Monthly Database Backup

on:
  schedule:
    # Berjalan setiap tanggal 1 tiap bulan pukul 01:00 UTC (08:00 WIB)
    - cron: '0 1 1 * *'
  # Memungkinkan trigger backup manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gzip

      - name: Run pg_dump from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILE="backup_supabase_${TIMESTAMP}.sql.gz"
          TAG_NAME="backup-${TIMESTAMP}"

          echo "Mengambil data dari Supabase Postgres..."
          pg_dump "${SUPABASE_DB_URL}" | gzip > "${BACKUP_FILE}"
          
          echo "Dump selesai: $(ls -lh ${BACKUP_FILE})"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Upload Backup to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Database Backup ${{ env.TAG_NAME }}"
          body: "Backup otomatis database Supabase pada ${{ env.TAG_NAME }}."
          files: ${{ env.BACKUP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
